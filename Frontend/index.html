<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GramConnect</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="splash-screen">

        <!-- Logo -->
        <div class="logo">
            <img src="/home/user/Downloads/WhatsApp Image 2026-08-13 at 7.30.26 PM.jpeg" alt="GramConnect Logo">
        </div>

        <!-- App Name -->
        <h1>GramConnect</h1>

        <!-- Tagline -->
        <p class="tagline">
            Connecting Villages, Building<br>
            Better Tomorrow
        </p>

        <!-- Loading -->
        <div class="loading-section">
            <div class="loader"></div>
            <p>Loading...</p>
        </div>

        <!-- Village Background -->
        <div class="village">

            <!-- Hills -->
            <div class="hill hill-left"></div>
            <div class="hill hill-right"></div>

            <!-- Trees -->
            <div class="tree tree1">
                <div class="trunk"></div>
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
            </div>

            <div class="tree tree2">
                <div class="trunk"></div>
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
            </div>

            <div class="tree tree3">
                <div class="trunk"></div>
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
            </div>
            <div class="tree tree4">
                <div class="trunk"></div>
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
            </div>
            <!-- Houses -->
            <div class="house house1">
                <div class="roof"></div>
                <div class="door"></div>
                <div class="window"></div>
            </div>

            <div class="house house2">
                <div class="roof"></div>
                <div class="door"></div>
                <div class="window"></div>
            </div>

            <!-- Grass -->
            <div class="grass"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
