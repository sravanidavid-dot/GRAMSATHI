<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f5f7f6;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }

        /* LEFT */

        .left-section {
            width: 50%;
            min-height: 100vh;
            background: #07883f;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 40px;
        }

        .left-section h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .left-section p {
            font-size: 20px;
            line-height: 1.7;
        }

        /* RIGHT */

        .right-section {
            width: 50%;
            min-height: 100vh;
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .otp-form {
            width: 75%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            font-size: 32px;
            color: #222;
            margin-bottom: 20px;
        }

        .description {
            color: #666;
            font-size: 17px;
            line-height: 1.7;
        }

        #phoneDisplay {
            color: #07883f;
        }

        /* OTP BOXES */

        .otp-box {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 30px 0;
        }

        .otp-box input {
            width: 55px;
            height: 60px;

            border: 1px solid #ccc;
            border-radius: 7px;

            text-align: center;
            font-size: 25px;
            font-weight: bold;

            outline: none;
        }

        .otp-box input:focus {
            border: 2px solid #07883f;
        }

        /* TIMER */

        .timer {
            color: #666;
            font-size: 16px;
            margin-bottom: 15px;
        }

        #timer {
            color: #07883f;
            font-weight: bold;
        }

        /* VERIFY */

        .verify-btn {
            width: 100%;
            padding: 15px;

            margin-top: 10px;

            background: #07883f;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 18px;
            cursor: pointer;
        }

        .verify-btn:hover {
            background: #056b31;
        }

        .verify-btn:disabled {
            background: #9db9aa;
            cursor: not-allowed;
        }

        /* RESEND */

        #resendBtn {
            display: none;

            padding: 11px 25px;
            margin: 10px auto 20px;

            background: white;
            color: #07883f;

            border: 2px solid #07883f;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        #resendBtn:hover {
            background: #07883f;
            color: white;
        }

        /* MESSAGE */

        #message {
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
            min-height: 25px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
                min-height: 50vh;
            }

            .left-section h1 {
                font-size: 35px;
            }

            .otp-form {
                width: 85%;
            }

            .otp-box {
                justify-content: center;
            }

            .otp-box input {
                width: 42px;
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT -->

        <div class="left-section">

            <h1>
                OTP Verification
            </h1>

            <p>
                Secure verification
                <br>
                for your account
            </p>

        </div>


        <!-- RIGHT -->

        <div class="right-section">

            <div class="otp-form">

                <h2>
                    Verify Your Number
                </h2>

                <p class="description">

                    Enter the 6-digit OTP sent to

                    <br>

                    <b id="phoneDisplay"></b>

                </p>


                <!-- OTP -->

                <div class="otp-box">

                    <input type="text" inputmode="numeric" maxlength="1" id="otp1" autocomplete="one-time-code">

                    <input type="text" inputmode="numeric" maxlength="1" id="otp2">

                    <input type="text" inputmode="numeric" maxlength="1" id="otp3">

                    <input type="text" inputmode="numeric" maxlength="1" id="otp4">

                    <input type="text" inputmode="numeric" maxlength="1" id="otp5">

                    <input type="text" inputmode="numeric" maxlength="1" id="otp6">

                </div>


                <!-- TIMER -->

                <div class="timer">

                    <span id="timerText">
                        Resend OTP in
                    </span>

                    <b id="timer">
                        30
                    </b>

                    <span id="seconds">
                        seconds
                    </span>

                </div>


                <!-- RESEND -->

                <button id="resendBtn" type="button" onclick="resendOTP()">
                    Resend OTP
                </button>


                <!-- VERIFY -->

                <button class="verify-btn" id="verifyBtn" type="button" onclick="verifyOTP()">
                    Verify OTP
                </button>


                <!-- MESSAGE -->

                <div id="message"></div>

            </div>

        </div>

    </div>


    <script>
        const API = "https://gramasathi-backend.onrender.com/api/forgot-password";
        const MSG91_WIDGET_ID = "366b67657a36313334303739";
        // Use the same OTP Widget token as frg.html. Never put MSG91 AuthKey here.
        const MSG91_WIDGET_TOKEN = "588016T2JXO9SokSOk6aeeb725P1";

        const phoneNumber = localStorage.getItem("resetMobile");
        const otpInputs = Array.from({ length: 6 }, (_, i) => document.getElementById("otp" + (i + 1)));
        let timer = null;
        let time = 30;
        let verifying = false;
        let msg91Ready = false;
        let msg91LoadPromise = null;

        const messageBox = document.getElementById("message");
        const verifyButton = document.getElementById("verifyBtn");
        const resendButton = document.getElementById("resendBtn");

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = type || "";
        }

        function loadMSG91Widget() {
            if (msg91Ready) return Promise.resolve();
            if (msg91LoadPromise) return msg91LoadPromise;
            msg91LoadPromise = new Promise((resolve, reject) => {
                window.configuration = {
                    widgetId: MSG91_WIDGET_ID,
                    tokenAuth: MSG91_WIDGET_TOKEN,
                    exposeMethods: true,
                    success: () => { },
                    failure: (error) => console.error("MSG91 widget error:", error)
                };
                const script = document.createElement("script");
                script.src = "https://verify.msg91.com/otp-provider.js";
                script.async = true;
                script.onload = () => {
                    if (typeof window.initSendOTP !== "function") {
                        reject(new Error("MSG91 SDK did not initialize."));
                        return;
                    }
                    window.initSendOTP(window.configuration);
                    const started = Date.now();
                    const waitForMethods = () => {
                        if (typeof window.verifyOtp === "function" && typeof window.retryOtp === "function") {
                            msg91Ready = true;
                            resolve();
                        } else if (Date.now() - started > 8000) {
                            reject(new Error("MSG91 OTP methods are unavailable."));
                        } else {
                            setTimeout(waitForMethods, 100);
                        }
                    };
                    waitForMethods();
                };
                script.onerror = () => reject(new Error("Could not load MSG91 SDK."));
                document.head.appendChild(script);
            });
            return msg91LoadPromise;
        }

        function callMSG91(method, args) {
            return new Promise((resolve, reject) => {
                try {
                    if (method === "verifyOtp" || method === "retryOtp") {
                        // MSG91 Web SDK signatures put reqId after the callbacks.
                        window[method](args[0], resolve, reject, args[1]);
                    } else {
                        window[method](args[0], resolve, reject);
                    }
                } catch (error) {
                    reject(error);
                }
            });
        }

        function getAccessToken(data) {
            return data?.["access-token"] || data?.accessToken || data?.access_token || data?.message || data?.data?.["access-token"] || "";
        }

        function getReqId(data) {
            return data?.reqId || data?.requestId || data?.message || data?.data?.reqId || localStorage.getItem("msg91ReqId") || "";
        }

        function startTimer() {
            clearInterval(timer);
            time = 30;
            document.getElementById("timer").textContent = time;
            document.getElementById("timerText").style.display = "inline";
            document.getElementById("timer").style.display = "inline";
            document.getElementById("seconds").style.display = "inline";
            resendButton.style.display = "none";
            timer = setInterval(() => {
                time--;
                document.getElementById("timer").textContent = time;
                if (time <= 0) {
                    clearInterval(timer);
                    document.getElementById("timerText").style.display = "none";
                    document.getElementById("timer").style.display = "none";
                    document.getElementById("seconds").style.display = "none";
                    resendButton.style.display = "block";
                }
            }, 1000);
        }

        function getEnteredOTP() {
            return otpInputs.map(input => input.value).join("").trim();
        }

        otpInputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                input.value = input.value.replace(/\D/g, "").slice(0, 1);
                if (input.value && index < 5) otpInputs[index + 1].focus();
            });
            input.addEventListener("keydown", event => {
                if (event.key === "Backspace" && !input.value && index > 0) otpInputs[index - 1].focus();
            });
        });

        async function verifyOTP() {
            if (verifying) return;
            if (!phoneNumber) {
                showMessage("Please return to Forgot Password.", "error");
                return;
            }
            const otp = getEnteredOTP();
            if (!/^\d{6}$/.test(otp)) {
                showMessage("Please enter the complete 6-digit OTP.", "error");
                return;
            }
            const reqId = getReqId({});
            if (!reqId) {
                showMessage("OTP request expired. Please return and request a new OTP.", "error");
                return;
            }

            verifying = true;
            verifyButton.disabled = true;
            verifyButton.textContent = "Verifying...";
            try {
                await loadMSG91Widget();
                const verifyResult = await callMSG91("verifyOtp", [otp, reqId]);
                if (verifyResult?.type === "error") {
                    throw new Error(verifyResult.message || "Incorrect or expired OTP.");
                }
                const accessToken = getAccessToken(verifyResult);
                if (!accessToken) throw new Error("MSG91 did not return a verification token.");

                const response = await fetch(`${API}/verify-widget-token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contact: phoneNumber, access_token: accessToken })
                });
                const result = await response.json();
                if (!response.ok || !result.success || !result.reset_token) {
                    throw new Error(result.message || "Server could not validate the OTP.");
                }

                localStorage.setItem("resetToken", result.reset_token);
                localStorage.removeItem("msg91ReqId");
                localStorage.removeItem("msg91AccessToken");
                clearInterval(timer);
                showMessage("OTP verified successfully!", "success");
                resendButton.style.display = "none";
                setTimeout(() => window.location.href = "reset.html", 800);
            } catch (error) {
                console.error("MSG91 OTP verification error:", error);
                showMessage(error.message || "OTP verification failed. Please try again.", "error");
                verifyButton.disabled = false;
                verifyButton.textContent = "Verify OTP";
            } finally {
                verifying = false;
            }
        }

        async function resendOTP() {
            if (!phoneNumber) {
                showMessage("Please return to Forgot Password.", "error");
                return;
            }
            resendButton.disabled = true;
            resendButton.textContent = "Sending...";
            try {
                await loadMSG91Widget();
                const reqId = getReqId({});
                // Default Configuration: MSG91 requires null as retry channel.
                const result = await callMSG91("retryOtp", [null, reqId]);
                if (result?.type === "error") throw new Error(result.message || "Could not resend OTP.");
                const nextReqId = getReqId(result);
                if (nextReqId) localStorage.setItem("msg91ReqId", nextReqId);
                otpInputs.forEach(input => input.value = "");
                showMessage("OTP resent. Please check your phone.", "success");
                startTimer();
                otpInputs[0].focus();
            } catch (error) {
                console.error("MSG91 resend error:", error);
                showMessage(error.message || "Could not resend OTP. Please try again.", "error");
            } finally {
                resendButton.disabled = false;
                resendButton.textContent = "Resend OTP";
            }
        }

        if (!phoneNumber) {
            showMessage("Please return to Forgot Password.", "error");
            verifyButton.disabled = true;
        } else {
            document.getElementById("phoneDisplay").textContent = phoneNumber;
            startTimer();
            otpInputs[0].focus();
        }
    </script>

</body>

</html>
