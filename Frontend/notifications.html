<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications - GramaSathi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4faf6;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #ddd;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            margin: 0;
            color: #087c48;
            font-size: 28px;
            font-weight: bold;
        }

        .back-btn {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: none;

            font-size: 32px;
            color: #222;

            cursor: pointer;
            line-height: 1;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 900px;
            margin: 35px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 8px;
            color: #087c48;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #087c48;
            font-size: 16px;
        }

        /* =========================
           ERROR
        ========================= */

        .error-message {
            background: #ffecec;
            color: #c62828;
            border: 1px solid #f3b5b5;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            background: white;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #087c48;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #777;
            font-size: 14px;
        }

        /* =========================
           NOTIFICATION CARD
        ========================= */

        .notification-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            gap: 18px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);

            border-left: 4px solid #087c48;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.10);
        }

        .notification-card.unread {
            background: #f0faf4;
        }

        .notification-card.read {
            opacity: 0.92;
        }

        /* =========================
           ICON
        ========================= */

        .notification-icon {
            width: 50px;
            height: 50px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            flex-shrink: 0;
        }

        .green {
            background: #e1f5e8;
        }

        .blue {
            background: #e4f0ff;
        }

        .yellow {
            background: #fff3d9;
        }

        .red {
            background: #ffe5e5;
        }

        /* =========================
           CONTENT
        ========================= */

        .notification-content {
            flex: 1;
        }

        .notification-content h3 {
            font-size: 17px;
            margin-bottom: 6px;
            color: #222;
        }

        .notification-content p {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .notification-time {
            color: #888;
            font-size: 12px;
        }

        /* =========================
           NEW LABEL
        ========================= */

        .new-label {
            background: #087c48;
            color: white;

            font-size: 11px;
            padding: 4px 9px;

            border-radius: 12px;
            align-self: flex-start;
        }

        /* =========================
           CLEAR BUTTON
        ========================= */

        .clear-btn {
            display: block;
            margin: 25px auto;

            padding: 11px 25px;

            border: 1px solid #087c48;
            border-radius: 25px;

            background: white;
            color: #087c48;

            font-size: 14px;
            cursor: pointer;

            transition: 0.2s ease;
        }

        .clear-btn:hover {
            background: #087c48;
            color: white;
        }

        .clear-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 60px;
            }

            .header h1 {
                font-size: 23px;
            }

            .back-btn {
                left: 18px;
                font-size: 28px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .page-title {
                font-size: 24px;
            }

            .notification-card {
                padding: 16px;
                gap: 12px;
            }

            .notification-icon {
                width: 44px;
                height: 44px;
                font-size: 21px;
            }

            .notification-content h3 {
                font-size: 15px;
            }

            .notification-content p {
                font-size: 13px;
            }

            .new-label {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <button class="back-btn" onclick="goBack()">
            ←
        </button>

        <h1>GRAMSATHI</h1>

    </header>


    <!-- =========================
         NOTIFICATIONS
    ========================= -->

    <main class="container">

        <h2 class="page-title">
            Notifications
        </h2>

        <p class="subtitle">
            Stay updated about your complaints and village services.
        </p>

        <!-- Notifications will load here -->
        <div id="notificationList">

            <div class="loading">
                Loading notifications...
            </div>

        </div>

        <!-- Mark all as read -->
        <button
            class="clear-btn"
            id="markAllBtn"
            onclick="markAllAsRead()">
            Mark All as Read
        </button>

    </main>


    <script>

        /* =====================================================
           CONFIGURATION
        ===================================================== */

        const API_BASE_URL = "https://gramasathi-backend.onrender.com";

        const notificationList =
            document.getElementById("notificationList");

        const markAllBtn =
            document.getElementById("markAllBtn");


        /* =====================================================
           GET LOGGED-IN USER
        ===================================================== */

        function getUserId() {

            return localStorage.getItem("gramasathiUserId");

        }


        /* =====================================================
           ESCAPE HTML
           Prevents notification text from being interpreted
           as HTML.
        ===================================================== */

        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           FORMAT DATE & TIME
        ===================================================== */

        function formatDateTime(dateString) {

            if (!dateString) {
                return "Just now";
            }

            const date = new Date(dateString);

            if (isNaN(date.getTime())) {
                return dateString;
            }

            return date.toLocaleString("en-IN", {

                day: "2-digit",
                month: "short",
                year: "numeric",

                hour: "2-digit",
                minute: "2-digit"

            });

        }


        /* =====================================================
           NOTIFICATION TYPE
        ===================================================== */

        function getNotificationStyle(message) {

            const text =
                String(message || "").toLowerCase();


            /* Resolved */

            if (
                text.includes("resolved") ||
                text.includes("successfully resolved")
            ) {

                return {
                    icon: "✅",
                    className: "green",
                    title: "Complaint Resolved"
                };

            }


            /* In Progress */

            if (
                text.includes("in progress") ||
                text.includes("progress")
            ) {

                return {
                    icon: "🔄",
                    className: "blue",
                    title: "Complaint Status Updated"
                };

            }


            /* Assigned */

            if (
                text.includes("assigned") ||
                text.includes("officer")
            ) {

                return {
                    icon: "👨‍💼",
                    className: "blue",
                    title: "Complaint Assigned"
                };

            }


            /* Submitted */

            if (
                text.includes("submitted") ||
                text.includes("complaint")
            ) {

                return {
                    icon: "📋",
                    className: "green",
                    title: "Complaint Update"
                };

            }


            /* Default */

            return {
                icon: "📢",
                className: "yellow",
                title: "Notification"
            };

        }


        /* =====================================================
           LOAD NOTIFICATIONS
        ===================================================== */

        async function loadNotifications() {

            const userId = getUserId();


            if (!userId) {

                notificationList.innerHTML = `
                    <div class="error-message">
                        Your login session was not found.
                        Please login again.
                    </div>
                `;

                markAllBtn.style.display = "none";

                return;
            }


            try {

                notificationList.innerHTML = `
                    <div class="loading">
                        Loading notifications...
                    </div>
                `;


                const response = await fetch(
                    `${API_BASE_URL}/api/notifications/${userId}`
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Unable to load notifications."
                    );

                }


                const notifications =
                    Array.isArray(data.notifications)
                        ? data.notifications
                        : [];


                renderNotifications(notifications);


            } catch (error) {

                console.error(
                    "Notification loading error:",
                    error
                );


                notificationList.innerHTML = `
                    <div class="error-message">
                        ${escapeHTML(
                            error.message ||
                            "Unable to load notifications."
                        )}
                    </div>
                `;

            }

        }


        /* =====================================================
           RENDER NOTIFICATIONS
        ===================================================== */

        function renderNotifications(notifications) {


            if (!notifications.length) {

                notificationList.innerHTML = `
                    <div class="empty-state">

                        <div class="empty-icon">
                            🔔
                        </div>

                        <h3>
                            No Notifications
                        </h3>

                        <p>
                            You don't have any notifications yet.
                        </p>

                    </div>
                `;

                markAllBtn.style.display = "none";

                return;

            }


            markAllBtn.style.display = "block";


            notificationList.innerHTML =
                notifications.map(function (notification) {

                    const style =
                        getNotificationStyle(
                            notification.message
                        );


                    const isUnread =
                        !Boolean(notification.is_read);


                    return `

                        <div
                            class="notification-card ${isUnread ? "unread" : "read"}"
                            data-id="${notification.id}"
                            onclick="markNotificationAsRead(${notification.id})"
                        >

                            <div
                                class="notification-icon ${style.className}"
                            >
                                ${style.icon}
                            </div>


                            <div class="notification-content">

                                <h3>
                                    ${style.title}
                                </h3>

                                <p>
                                    ${escapeHTML(
                                        notification.message
                                    )}
                                </p>

                                <span class="notification-time">
                                    ${formatDateTime(
                                        notification.created_at
                                    )}
                                </span>

                            </div>


                            ${
                                isUnread
                                    ? `
                                        <span class="new-label">
                                            New
                                        </span>
                                      `
                                    : ""
                            }

                        </div>

                    `;

                }).join("");

        }


        /* =====================================================
           MARK SINGLE NOTIFICATION AS READ
        ===================================================== */

        async function markNotificationAsRead(notificationId) {

            try {

                const response = await fetch(
                    `${API_BASE_URL}/api/notifications/${notificationId}/read`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    console.error(
                        "Unable to mark notification as read:",
                        data.message
                    );

                    return;

                }


                /*
                    Update UI immediately
                    without reloading the page.
                */

                const card =
                    document.querySelector(
                        `.notification-card[data-id="${notificationId}"]`
                    );


                if (card) {

                    card.classList.remove("unread");
                    card.classList.add("read");


                    const newLabel =
                        card.querySelector(".new-label");


                    if (newLabel) {
                        newLabel.remove();
                    }

                }


            } catch (error) {

                console.error(
                    "Mark notification read error:",
                    error
                );

            }

        }


        /* =====================================================
           MARK ALL AS READ
        ===================================================== */

        async function markAllAsRead() {

            const cards =
                document.querySelectorAll(
                    ".notification-card.unread"
                );


            if (!cards.length) {

                return;

            }


            markAllBtn.disabled = true;
            markAllBtn.textContent = "Updating...";


            try {

                /*
                    Get notification IDs from visible cards.
                */

                const notificationIds =
                    Array.from(cards).map(function (card) {

                        return card.dataset.id;

                    });


                /*
                    Mark each unread notification as read.
                */

                await Promise.all(

                    notificationIds.map(function (id) {

                        return fetch(
                            `${API_BASE_URL}/api/notifications/${id}/read`,
                            {
                                method: "PUT",
                                headers: {
                                    "Content-Type": "application/json"
                                }
                            }
                        );

                    })

                );


                /*
                    Update UI after backend update.
                */

                cards.forEach(function (card) {

                    card.classList.remove("unread");
                    card.classList.add("read");


                    const newLabel =
                        card.querySelector(".new-label");


                    if (newLabel) {
                        newLabel.remove();
                    }

                });


            } catch (error) {

                console.error(
                    "Mark all notifications error:",
                    error
                );


                alert(
                    "Unable to mark all notifications as read."
                );

            } finally {

                markAllBtn.disabled = false;
                markAllBtn.textContent = "Mark All as Read";

            }

        }


        /* =====================================================
           GO BACK
        ===================================================== */

        function goBack() {

            window.location.href =
                "dashboard.html";

        }


        /* =====================================================
           LOAD WHEN PAGE OPENS
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadNotifications();

            }
        );

    </script>

</body>

</html>
