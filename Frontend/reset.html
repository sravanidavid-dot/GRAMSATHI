<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #effbee;
            min-height: 100vh;
        }

        .password-screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
        }

        .back-button {
            align-self: flex-start;
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            color: #086b36;
            margin-bottom: 35px;
        }

        .back-button:hover {
            color: #034d25;
        }

        .password-content {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(8, 107, 54, 0.10);
        }

        .password-content h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #086b36;
        }

        .password-content p {
            font-size: 14px;
            line-height: 1.6;
            color: #647067;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #254b35;
            margin-bottom: 9px;
        }

        .password-box {
            position: relative;
            width: 100%;
        }

        .password-box input {
            width: 100%;
            height: 48px;
            padding: 12px 48px 12px 14px;
            border: 1px solid #c9dfce;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
            background: #ffffff;
            color: #25352a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .password-box input:focus {
            border-color: #25864b;
            box-shadow: 0 0 0 3px rgba(37, 134, 75, 0.10);
        }

        .password-box input::placeholder {
            color: #9aa99e;
        }

        /* Password eye icon */
        .eye-button {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #477454;
            font-size: 19px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-icon {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        /* Diagonal line when password is hidden */
        .eye-button.hide-eye .eye-icon::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 2px;
            background: #477454;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            border-radius: 2px;
        }

        /* Password requirements heading */
        .requirements-heading {
            display: inline-block;
            font-size: 14px;
            color: #16803d;
            cursor: pointer;
            margin-top: -8px;
            margin-bottom: 14px;
            user-select: none;
        }

        .requirements-heading:hover {
            color: #075c2b;
            text-decoration: underline;
        }

        /* Requirements initially hidden */
        .requirements {
            display: none;
            list-style: none;
            padding: 14px;
            margin-bottom: 22px;
            background: #f4fbf4;
            border: 1px solid #d6ead9;
            border-radius: 7px;
        }

        /* Show requirements on click */
        .requirements.show {
            display: block;
        }

        .requirements li {
            font-size: 13px;
            color: #78847b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .requirements li:last-child {
            margin-bottom: 0;
        }

        .requirements li span {
            font-size: 16px;
            min-width: 15px;
        }

        .requirements li.valid {
            color: #16803d;
        }

        .requirements li.valid span {
            color: #16803d;
        }

        /* Reset button */
        .reset-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 7px;
            background: #087b3f;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .reset-button:hover {
            background: #065f32;
        }

        .reset-button:active {
            transform: scale(0.99);
        }

        .reset-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Messages */
        .message {
            display: none;
            font-size: 14px;
            padding: 12px;
            border-radius: 6px;
            margin-top: 16px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #a12626;
            background: #fff0f0;
            border: 1px solid #f0cccc;
        }

        .message.success {
            display: block;
            color: #146c43;
            background: #e5f6e9;
            border: 1px solid #c7e8d0;
        }

        @media (max-width: 480px) {
            .password-screen {
                padding: 20px 16px;
            }

            .back-button {
                margin-bottom: 28px;
            }

            .password-content {
                padding: 24px 20px;
            }

            .password-content h1 {
                font-size: 25px;
            }

            .password-content p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="password-screen">

        <button type="button" class="back-button" onclick="goBack()">
            &#8592; Back
        </button>

        <main class="password-content">

            <h1>Reset Password</h1>

            <p>
                Create a new password for your account.
                Make sure your password meets all the requirements below.
            </p>

            <form id="resetPasswordForm" novalidate>

                <!-- New Password -->
                <div class="input-group">

                    <label for="newPassword">New Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button hide-eye"
                            aria-label="Show password"
                            aria-pressed="false"
                            onclick="togglePassword('newPassword', this)"
                        >
                            <span class="eye-icon">&#128065;</span>
                        </button>

                    </div>
                </div>

                <!-- Password Requirements -->
                <div
                    class="requirements-heading"
                    role="button"
                    tabindex="0"
                    aria-expanded="false"
                    aria-controls="requirements"
                    onclick="toggleRequirements()"
                    onkeydown="handleRequirementsKey(event)"
                >
                    Password requirements
                    <span id="requirementsArrow">&#9662;</span>
                </div>

                <ul class="requirements" id="requirements">

                    <li id="length">
                        <span>○</span>
                        At least 8 characters
                    </li>

                    <li id="uppercase">
                        <span>○</span>
                        At least one uppercase letter (A-Z)
                    </li>

                    <li id="number">
                        <span>○</span>
                        At least one number (0-9)
                    </li>

                    <li id="special">
                        <span>○</span>
                        At least one special character
                    </li>

                </ul>

                <!-- Confirm Password -->
                <div class="input-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button hide-eye"
                            aria-label="Show password"
                            aria-pressed="false"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            <span class="eye-icon">&#128065;</span>
                        </button>

                    </div>
                </div>

                <button type="submit" class="reset-button">
                    Reset Password
                </button>

                <div
                    id="message"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>

        </main>
    </div>

    <script>
        // Show or hide password.
        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);
            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";

            button.classList.toggle("hide-eye", !isHidden);

            button.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );

            button.setAttribute(
                "aria-pressed",
                String(isHidden)
            );
        }

        const passwordInput =
            document.getElementById("newPassword");

        const confirmInput =
            document.getElementById("confirmPassword");

        const form =
            document.getElementById("resetPasswordForm");

        const message =
            document.getElementById("message");

        const requirements =
            document.getElementById("requirements");

        const requirementsHeading =
            document.querySelector(".requirements-heading");

        const requirementsArrow =
            document.getElementById("requirementsArrow");


        // Validate requirements while typing.
        passwordInput.addEventListener("input", function () {

            const password = passwordInput.value;

            checkRequirement(
                "length",
                password.length >= 8
            );

            checkRequirement(
                "uppercase",
                /[A-Z]/.test(password)
            );

            checkRequirement(
                "number",
                /[0-9]/.test(password)
            );

            checkRequirement(
                "special",
                /[^A-Za-z0-9]/.test(password)
            );

            clearMessage();
        });

        confirmInput.addEventListener("input", clearMessage);


        // Update the requirement icon and color.
        function checkRequirement(id, valid) {

            const element = document.getElementById(id);
            const icon = element.querySelector("span");

            if (valid) {

                element.classList.add("valid");
                icon.textContent = "✓";

            } else {

                element.classList.remove("valid");
                icon.textContent = "○";
            }
        }


        // Open or close the requirements list.
        function toggleRequirements() {

            const isOpen =
                requirements.classList.toggle("show");

            requirementsHeading.setAttribute(
                "aria-expanded",
                String(isOpen)
            );

            requirementsArrow.textContent =
                isOpen ? "▴" : "▾";
        }


        // Keyboard support for requirements heading.
        function handleRequirementsKey(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();
                toggleRequirements();
            }
        }


        // Display messages.
        function showMessage(text, type) {

            message.textContent = text;
            message.className = "message " + type;
        }


        function clearMessage() {

            message.textContent = "";
            message.className = "message";
        }


        // Check all password requirements.
        function passwordIsValid(password) {

            return (
                password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /[0-9]/.test(password) &&
                /[^A-Za-z0-9]/.test(password)
            );
        }


        // Submit the new password to Flask.
        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;


            if (
                password === "" ||
                confirmPassword === ""
            ) {

                showMessage(
                    "Please enter and confirm your password.",
                    "error"
                );

                return;
            }


            if (!passwordIsValid(password)) {

                showMessage(
                    "Please meet all password requirements before continuing.",
                    "error"
                );

                requirements.classList.add("show");

                requirementsHeading.setAttribute(
                    "aria-expanded",
                    "true"
                );

                requirementsArrow.textContent = "▴";

                return;
            }


            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            const resetToken =
                localStorage.getItem("resetToken");


            if (!resetToken) {

                showMessage(
                    "Reset session expired. Please verify your OTP again.",
                    "error"
                );

                return;
            }


            const resetButton =
                form.querySelector(".reset-button");

            resetButton.disabled = true;
            resetButton.textContent = "Resetting...";


            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/api/forgot-password/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            reset_token: resetToken,
                            new_password: password,
                            confirm_password: confirmPassword
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    showMessage(
                        data.error ||
                        data.message ||
                        "Unable to reset password.",
                        "error"
                    );

                    return;
                }


                localStorage.removeItem("resetToken");
                localStorage.removeItem("resetMobile");

                showMessage(
                    "Password reset successfully. You can now log in.",
                    "success"
                );

                form.reset();

                [
                    "length",
                    "uppercase",
                    "number",
                    "special"
                ].forEach(function (id) {

                    checkRequirement(id, false);
                });


            } catch (error) {

                showMessage(
                    "Backend connection failed. Check whether Flask is running.",
                    "error"
                );

            } finally {

                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }
        });


        // Return to the previous page.
        function goBack() {

            if (window.history.length > 1) {

                window.history.back();

            } else {

                window.location.href = "frg.html";
            }
        }
    </script>

</body>
</html>
