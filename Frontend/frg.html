<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="frg.css">
</head>

<body>

    <div class="container">

        <div class="left">
            <div class="form-box">
                <h2>Forgot Password?</h2>

                <p>
                    Enter your mobile number<br>
                    or email to receive OTP
                </p>

                <input type="text" id="contactInput" placeholder="Mobile Number / Email">


                <button type="button" id="sendOtpButton">
                    Send OTP
                </button>

                <p id="otpMessage"></p>
            </div>
        </div>

        <div class="right">
            <div class="illustration">
                🔒
            </div>
            <h1>Reset Your Password</h1>
            <p>Don't worry! We'll help you get back into your account.</p>
        </div>

    </div>
    <script>
        const API = "https://gramasathi-backend.onrender.com/api/forgot-password";
        const MSG91_WIDGET_ID = "366b67657a36313334303739";
        // Replace this placeholder with the OTP Widget token selected in your MSG91 dashboard.
        const MSG91_WIDGET_TOKEN = "588016T2JXO9SokSOk6aeeb725P1";

        let msg91Ready = false;
        let msg91LoadPromise = null;

        function loadMSG91Widget() {
            if (msg91Ready) return Promise.resolve();
            if (msg91LoadPromise) return msg91LoadPromise;

            msg91LoadPromise = new Promise((resolve, reject) => {
                window.configuration = {
                    widgetId: MSG91_WIDGET_ID,
                    tokenAuth: MSG91_WIDGET_TOKEN,
                    exposeMethods: true,
                    success: () => { },
                    failure: (error) => console.error("MSG91 widget error:", error)
                };

                const script = document.createElement("script");
                script.src = "https://verify.msg91.com/otp-provider.js";
                script.async = true;
                script.onload = () => {
                    if (typeof window.initSendOTP !== "function") {
                        reject(new Error("MSG91 SDK did not initialize."));
                        return;
                    }
                    window.initSendOTP(window.configuration);
                    const started = Date.now();
                    const waitForMethods = () => {
                        if (typeof window.sendOtp === "function") {
                            msg91Ready = true;
                            resolve();
                        } else if (Date.now() - started > 8000) {
                            reject(new Error("MSG91 OTP methods are unavailable."));
                        } else {
                            setTimeout(waitForMethods, 100);
                        }
                    };
                    waitForMethods();
                };
                script.onerror = () => reject(new Error("Could not load MSG91 SDK."));
                document.head.appendChild(script);
            });
            return msg91LoadPromise;
        }

        function callMSG91(method, args) {
            return new Promise((resolve, reject) => {
                try {
                    if (method === "verifyOtp" || method === "retryOtp") {
                        // MSG91 Web SDK signatures put reqId after the callbacks.
                        window[method](args[0], resolve, reject, args[1]);
                    } else {
                        window[method](args[0], resolve, reject);
                    }
                } catch (error) {
                    reject(error);
                }
            });
        }

        function getReqId(data) {
            return data?.reqId || data?.requestId || data?.message || data?.data?.reqId || "";
        }

        function normalizePhoneForMSG91(contact) {
            const digits = contact.replace(/\D/g, "");
            if (digits.length === 10) return "91" + digits;
            if (digits.length === 12 && digits.startsWith("91")) return digits;
            return digits;
        }

        document.getElementById("sendOtpButton").addEventListener("click", async () => {
            const contact = document.getElementById("contactInput").value.trim();
            const message = document.getElementById("otpMessage");
            const button = document.getElementById("sendOtpButton");
            message.textContent = "";

            if (!contact) {
                message.textContent = "Enter your mobile number or email.";
                return;
            }

            button.disabled = true;
            button.textContent = "Checking...";
            try {
                const response = await fetch(`${API}/send-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contact })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "No account found with these details.");
                }

                await loadMSG91Widget();
                button.textContent = "Sending OTP...";
                const identifier = contact.includes("@") ? contact : normalizePhoneForMSG91(contact);
                const sendResult = await callMSG91("sendOtp", [identifier]);
                if (sendResult?.type === "error") {
                    throw new Error(sendResult.message || "MSG91 could not send the OTP.");
                }

                const reqId = getReqId(sendResult);
                if (sendResult?.type !== "success" || (!reqId && !sendResult?.["access-token"])) {
                    throw new Error(sendResult?.message || "MSG91 did not return an OTP request ID.");
                }

                localStorage.setItem("resetMobile", data.contact || contact.toLowerCase());
                if (reqId) localStorage.setItem("msg91ReqId", reqId);
                if (sendResult?.["access-token"]) {
                    localStorage.setItem("msg91AccessToken", sendResult["access-token"]);
                }
                window.location.href = "otp.html";
            } catch (error) {
                console.error("Send MSG91 OTP error:", error);
                message.textContent = error.message || "Unable to send OTP. Please try again.";
                button.disabled = false;
                button.textContent = "Send OTP";
            }
        });
    </script>
</body>

</html>
