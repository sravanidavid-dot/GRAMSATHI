<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="frg.css">
</head>
<body>

    <div class="container">

        <div class="left">
            <div class="form-box">
                <h2>Forgot Password?</h2>

                <p>
                    Enter your mobile number<br>
                    or email to receive OTP
                </p>

                <input type="text" placeholder="Mobile Number / Email">

                <button>Send OTP</button>
            </div>
        </div>

        <div class="right">
            <div class="illustration">
                🔒
            </div>
            <h1>Reset Your Password</h1>
            <p>Don't worry! We'll help you get back into your account.</p>
        </div>

    </div>

</body>
</html>
