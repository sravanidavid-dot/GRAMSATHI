<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GramaSathi - Track</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .onboarding {
            position: relative;

            width: 100vw;
            height: 100vh;

            background-image: url("/home/user/Downloads/ChatGPT Image Aug 13, 2026, 06_07_41 PM.png");

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            overflow: hidden;
        }


        /* ---------------- TEXT ---------------- */

        .content {
            position: absolute;

            top: 8%;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;
            max-width: 700px;

            text-align: center;

            z-index: 3;
        }

        .content h1 {
            color: #05652f;

            font-size: clamp(40px, 4.5vw, 62px);

            font-weight: 700;

            line-height: 1.1;

            margin-bottom: 20px;
        }

        .content p {
            color: #222;

            font-size: clamp(20px, 2.1vw, 29px);

            line-height: 1.4;

            font-weight: 400;
        }


        /* ---------------- BOTTOM FADE ---------------- */

        .bottom-fade {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 22%;

            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0.75),
                rgba(245, 250, 252, 0.98)
            );

            z-index: 2;

            pointer-events: none;
        }


        /* ---------------- SKIP ---------------- */

        .skip {
            position: absolute;

            left: 5.5%;
            bottom: 6%;

            z-index: 5;

            border: none;

            background: transparent;

            color: #222;

            font-size: 22px;

            font-weight: 500;

            cursor: pointer;
        }


        /* ---------------- NEXT ---------------- */

        .next {
            position: absolute;

            right: 4.5%;
            bottom: 4.5%;

            z-index: 5;

            width: 195px;
            height: 75px;

            border: none;

            border-radius: 17px;

            background: #006b36;

            color: white;

            font-size: 30px;

            font-weight: 500;

            cursor: pointer;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .next:hover {
            background: #00582d;
        }


        /* ---------------- DOTS ---------------- */

        .dots {
            position: absolute;

            left: 50%;
            bottom: 7.5%;

            transform: translateX(-50%);

            display: flex;

            align-items: center;

            gap: 35px;

            z-index: 5;
        }

        .dot {
            width: 17px;
            height: 17px;

            border-radius: 50%;

            background: #aeb2b3;
        }

        .dot.active {
            background: #08733e;
        }


        /* ---------------- MOBILE ---------------- */

        @media (max-width: 600px) {

            .onboarding {
                background-position: center center;
            }

            .content {
                top: 7%;
                width: 92%;
            }

            .content h1 {
                font-size: 34px;
                margin-bottom: 12px;
            }

            .content p {
                font-size: 17px;
            }

            .skip {
                left: 25px;
                bottom: 28px;

                font-size: 17px;
            }

            .next {
                right: 20px;
                bottom: 18px;

                width: 110px;
                height: 52px;

                border-radius: 13px;

                font-size: 18px;
            }

            .dots {
                bottom: 37px;
                gap: 10px;
            }

            .dot {
                width: 9px;
                height: 9px;
            }
        }

    </style>
</head>

<body>

    <div class="onboarding">

        <!-- Heading -->
        <div class="content">

            <h1>
                Track in Real Time
            </h1>

            <p>
                Track status of your<br>
                complaints in real time.
            </p>

        </div>


        <!-- Bottom white fade -->
        <div class="bottom-fade"></div>


        <!-- Skip -->
        <button class="skip">
            Skip
        </button>


        <!-- Dots -->
        <div class="dots">

            <span class="dot"></span>

            <span class="dot active"></span>

            <span class="dot"></span>

        </div>


        <!-- Next -->
        <button class="next">
            Next
        </button>

    </div>

</body>
</html>
