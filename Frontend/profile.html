
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - GramaSathi</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4faf6;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #ddd;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            color: #087c48;
            font-size: 28px;
            font-weight: bold;
        }

        .back-btn {
            position: absolute;
            left: 30px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: none;

            font-size: 32px;
            color: #222;

            cursor: pointer;
            line-height: 1;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 850px;

            margin: 35px auto;
        }

        .page-title {
            text-align: center;

            color: #087c48;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            font-size: 15px;

            margin-bottom: 30px;
        }

        /* =========================
           PROFILE CARD
        ========================= */

        .profile-card {
            background: white;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.07);
        }

        /* =========================
           PROFILE TOP
        ========================= */

        .profile-top {
            display: flex;

            align-items: center;

            gap: 20px;

            padding-bottom: 25px;

            border-bottom: 1px solid #eee;
        }

        /* =========================
           PROFILE IMAGE
        ========================= */

        .profile-image {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            background: #e1f5e8;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            overflow: hidden;

            cursor: pointer;

            border: 3px solid #087c48;

            position: relative;

            flex-shrink: 0;
        }

        .profile-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }

        .profile-image span {
            font-size: 42px;
        }

        .profile-image:hover {
            opacity: 0.85;
        }

        /* =========================
           PROFILE NAME
        ========================= */

        .profile-name {
            color: #087c48;

            font-size: 24px;

            margin-bottom: 6px;
        }

        .profile-role {
            color: #777;

            font-size: 14px;
        }

        /* =========================
           SECTION TITLE
        ========================= */

        .details-title {
            color: #087c48;

            font-size: 19px;

            margin: 25px 0 18px;
        }

        /* =========================
           NORMAL DETAILS
        ========================= */

        .detail-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 15px 5px;

            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #777;

            font-size: 14px;
        }

        .detail-value {
            color: #222;

            font-size: 15px;

            font-weight: 500;

            text-align: right;
        }

        /* =========================
           EDIT INPUTS
        ========================= */

        .edit-input {
            width: 55%;

            padding: 10px 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

            text-align: right;

            display: none;
        }

        .edit-input:focus {
            border-color: #087c48;

            box-shadow:
                0 0 0 2px rgba(8, 124, 72, 0.1);
        }

        /* =========================
           BUTTONS
        ========================= */

        .actions {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 30px;
        }

        .action-btn {
            padding: 11px 26px;

            border-radius: 25px;

            font-size: 14px;

            cursor: pointer;

            border: 1px solid #087c48;
        }

        .edit-btn {
            background: #087c48;

            color: white;
        }

        .edit-btn:hover {
            background: #05663b;
        }

        .save-btn {
            background: #087c48;

            color: white;

            display: none;
        }

        .save-btn:hover {
            background: #05663b;
        }

        .cancel-btn {
            background: white;

            color: #087c48;

            display: none;
        }

        .cancel-btn:hover {
            background: #f0faf4;
        }

        .logout-btn {
            background: white;

            color: #087c48;
        }

        .logout-btn:hover {
            background: #087c48;

            color: white;
        }

        /* =========================
           STATUS MESSAGE
        ========================= */

        .status-message {
            text-align: center;

            margin-top: 18px;

            font-size: 14px;

            min-height: 20px;
        }

        .loading-message {
            color: #087c48;
        }

        .success-message {
            color: #087c48;
        }

        .error-message {
            color: #d32f2f;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 60px;
            }

            .header h1 {
                font-size: 23px;
            }

            .back-btn {
                left: 18px;

                font-size: 28px;
            }

            .container {
                width: 94%;

                margin: 25px auto;
            }

            .page-title {
                font-size: 24px;
            }

            .profile-card {
                padding: 20px;
            }

            .profile-top {
                gap: 15px;
            }

            .profile-image {
                width: 70px;
                height: 70px;
            }

            .profile-image span {
                font-size: 34px;
            }

            .profile-name {
                font-size: 20px;
            }

            .detail-row {
                gap: 15px;

                align-items: center;
            }

            .edit-input {
                width: 60%;
            }

            .actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <button class="back-btn" onclick="goBack()">
            ←
        </button>

        <h1>GRAMSATHI</h1>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">

        <h2 class="page-title">
            My Profile
        </h2>

        <p class="subtitle">
            View and manage your account information.
        </p>


        <div class="profile-card">

            <!-- =========================
                 PROFILE TOP
            ========================= -->

            <div class="profile-top">

                <!-- PROFILE IMAGE -->

                <div
                    class="profile-image"
                    onclick="chooseProfileImage()"
                    title="Click to change profile photo"
                >

                    <img
                        id="profileImage"
                        src=""
                        alt="Profile Image"
                    >

                    <span id="defaultProfileIcon">
                        👤
                    </span>

                </div>


                <!-- Hidden file input -->

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    style="display:none"
                    onchange="previewProfileImage(event)"
                >


                <!-- NAME -->

                <div>

                    <h2
                        class="profile-name"
                        id="profileName"
                    >
                        Loading...
                    </h2>

                    <p class="profile-role">
                        Village Citizen
                    </p>

                    <small style="color:#888;">
                        Click the photo to change it
                    </small>

                </div>

            </div>


            <!-- =========================
                 PERSONAL INFORMATION
            ========================= -->

            <h3 class="details-title">
                Personal Information
            </h3>


            <!-- NAME -->

            <div class="detail-row">

                <span class="detail-label">
                    Full Name
                </span>

                <span
                    class="detail-value"
                    id="nameDisplay"
                >
                    Loading...
                </span>

                <input
                    type="text"
                    id="nameInput"
                    class="edit-input"
                    placeholder="Enter your name"
                >

            </div>


            <!-- MOBILE -->

            <div class="detail-row">

                <span class="detail-label">
                    Mobile Number
                </span>

                <span
                    class="detail-value"
                    id="mobileDisplay"
                >
                    Loading...
                </span>

                <input
                    type="tel"
                    id="mobileInput"
                    class="edit-input"
                    placeholder="Enter mobile number"
                    maxlength="10"
                >

            </div>


            <!-- EMAIL -->

            <div class="detail-row">

                <span class="detail-label">
                    Email
                </span>

                <span
                    class="detail-value"
                    id="emailDisplay"
                >
                    Loading...
                </span>

                <input
                    type="email"
                    id="emailInput"
                    class="edit-input"
                    placeholder="Enter email"
                >

            </div>


            <!-- VILLAGE -->

            <div class="detail-row">

                <span class="detail-label">
                    Village
                </span>

                <span
                    class="detail-value"
                    id="villageDisplay"
                >
                    Loading...
                </span>

                <input
                    type="text"
                    id="villageInput"
                    class="edit-input"
                    placeholder="Enter village"
                >

            </div>


            <!-- =========================
                 ACCOUNT INFORMATION
            ========================= -->

            <h3 class="details-title">
                Account Information
            </h3>


            <div class="detail-row">

                <span class="detail-label">
                    Account Type
                </span>

                <span
                    class="detail-value"
                    id="accountTypeDisplay"
                >
                    Citizen
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Account Status
                </span>

                <span
                    class="detail-value"
                    style="color:#087c48;"
                >
                    Active
                </span>

            </div>


            <!-- =========================
                 BUTTONS
            ========================= -->

            <div class="actions">

                <button
                    class="action-btn edit-btn"
                    id="editButton"
                    onclick="editProfile()"
                >
                    Edit Profile
                </button>


                <button
                    class="action-btn logout-btn"
                    id="logoutButton"
                    onclick="logout()"
                >
                    Logout
                </button>


                <button
                    class="action-btn save-btn"
                    id="saveButton"
                    onclick="saveProfile()"
                >
                    Save Changes
                </button>


                <button
                    class="action-btn cancel-btn"
                    id="cancelButton"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </div>


            <!-- STATUS -->

            <div
                id="statusMessage"
                class="status-message"
            ></div>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* ==========================================
           BACKEND URL
        ========================================== */

        const API_BASE_URL =
            "http://127.0.0.1:5001";


        /* ==========================================
           GET LOGGED-IN USER ID
        ========================================== */

        const userId =
            localStorage.getItem("gramasathiUserId");


        /* ==========================================
           CHECK LOGIN
        ========================================== */

        if (!userId) {

            alert("Please login first.");

            window.location.href =
                "login(2).html";

        }


        /* ==========================================
           STATUS MESSAGE
        ========================================== */

        function showStatus(message, type = "") {

            const status =
                document.getElementById("statusMessage");

            status.textContent = message;

            status.className =
                "status-message " + type;

        }


        /* ==========================================
           LOAD PROFILE FROM BACKEND
        ========================================== */

        async function loadProfile() {

            if (!userId) {
                return;
            }

            showStatus(
                "Loading profile...",
                "loading-message"
            );

            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/user/${userId}`
                    );


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Unable to load profile."
                    );

                }


                const user =
                    data.user;


                /* =========================
                   DISPLAY DATA
                ========================= */

                document.getElementById(
                    "profileName"
                ).textContent =
                    user.name || "GramaSathi User";


                document.getElementById(
                    "nameDisplay"
                ).textContent =
                    user.name || "Not provided";


                document.getElementById(
                    "mobileDisplay"
                ).textContent =
                    user.mobile || "Not provided";


                document.getElementById(
                    "emailDisplay"
                ).textContent =
                    user.email || "Not provided";


                document.getElementById(
                    "villageDisplay"
                ).textContent =
                    user.village || "Not provided";


                /* =========================
                   INPUT DATA
                ========================= */

                document.getElementById(
                    "nameInput"
                ).value =
                    user.name || "";


                document.getElementById(
                    "mobileInput"
                ).value =
                    user.mobile || "";


                document.getElementById(
                    "emailInput"
                ).value =
                    user.email || "";


                document.getElementById(
                    "villageInput"
                ).value =
                    user.village || "";


                /* =========================
                   ACCOUNT ROLE
                ========================= */

                let role =
                    user.role || "citizen";


                if (role === "citizen") {

                    document.getElementById(
                        "accountTypeDisplay"
                    ).textContent =
                        "Citizen";

                } else {

                    document.getElementById(
                        "accountTypeDisplay"
                    ).textContent =
                        role.charAt(0).toUpperCase() +
                        role.slice(1);

                }


                /* =========================
                   SAVE CURRENT DATA LOCALLY
                   FOR OTHER FRONTEND PAGES
                ========================= */

                localStorage.setItem(
                    "registeredFullName",
                    user.name || ""
                );

                localStorage.setItem(
                    "registeredMobile",
                    user.mobile || ""
                );

                localStorage.setItem(
                    "registeredEmail",
                    user.email || ""
                );

                localStorage.setItem(
                    "registeredVillage",
                    user.village || ""
                );


                /* =========================
                   PROFILE IMAGE
                ========================= */

                if (user.profile_image) {

                    const image =
                        document.getElementById(
                            "profileImage"
                        );

                    const defaultIcon =
                        document.getElementById(
                            "defaultProfileIcon"
                        );


                    image.src =
                        user.profile_image;

                    image.style.display =
                        "block";

                    defaultIcon.style.display =
                        "none";

                } else {

                    loadProfileImage();

                }


                showStatus("");

            }

            catch (error) {

                console.error(
                    "Profile loading error:",
                    error
                );

                showStatus(
                    "Unable to load profile from server.",
                    "error-message"
                );

            }

        }


        /* ==========================================
           CHOOSE PROFILE IMAGE
        ========================================== */

        function chooseProfileImage() {

            document
                .getElementById("imageInput")
                .click();

        }


        /* ==========================================
           PREVIEW PROFILE IMAGE
        ========================================== */

        function previewProfileImage(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "Please select a valid image file."
                );

                return;

            }


            if (file.size > 2 * 1024 * 1024) {

                alert(
                    "Please select an image smaller than 2 MB."
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (e) {

                    const image =
                        document.getElementById(
                            "profileImage"
                        );


                    const defaultIcon =
                        document.getElementById(
                            "defaultProfileIcon"
                        );


                    image.src =
                        e.target.result;


                    image.style.display =
                        "block";


                    defaultIcon.style.display =
                        "none";


                    /*
                       Current backend does not yet
                       have an image upload endpoint.

                       So image is temporarily stored
                       in browser localStorage.
                    */

                    localStorage.setItem(
                        "profileImage",
                        e.target.result
                    );

                    showStatus(
                        "Profile photo preview updated.",
                        "success-message"
                    );

                };


            reader.readAsDataURL(file);

        }


        /* ==========================================
           LOAD LOCAL PROFILE IMAGE
        ========================================== */

        function loadProfileImage() {

            const savedImage =
                localStorage.getItem(
                    "profileImage"
                );


            if (!savedImage) {
                return;
            }


            const image =
                document.getElementById(
                    "profileImage"
                );


            const defaultIcon =
                document.getElementById(
                    "defaultProfileIcon"
                );


            image.src =
                savedImage;


            image.style.display =
                "block";


            defaultIcon.style.display =
                "none";

        }


        /* ==========================================
           EDIT PROFILE
        ========================================== */

        function editProfile() {

            document
                .querySelectorAll(".detail-value")
                .forEach(function (element) {

                    element.style.display =
                        "none";

                });


            document
                .querySelectorAll(".edit-input")
                .forEach(function (element) {

                    element.style.display =
                        "block";

                });


            document.getElementById(
                "editButton"
            ).style.display =
                "none";


            document.getElementById(
                "logoutButton"
            ).style.display =
                "none";


            document.getElementById(
                "saveButton"
            ).style.display =
                "inline-block";


            document.getElementById(
                "cancelButton"
            ).style.display =
                "inline-block";


            showStatus("");

        }


        /* ==========================================
           SAVE PROFILE TO MYSQL
        ========================================== */

        async function saveProfile() {

            const name =
                document
                    .getElementById("nameInput")
                    .value
                    .trim();


            const mobile =
                document
                    .getElementById("mobileInput")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("emailInput")
                    .value
                    .trim();


            const village =
                document
                    .getElementById("villageInput")
                    .value
                    .trim();


            /* =========================
               VALIDATION
            ========================= */

            if (name === "") {

                alert(
                    "Please enter your full name."
                );

                return;

            }


            if (!/^[0-9]{10}$/.test(mobile)) {

                alert(
                    "Please enter a valid 10-digit mobile number."
                );

                return;

            }


            if (
                email !== "" &&
                !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
            ) {

                alert(
                    "Please enter a valid email address."
                );

                return;

            }


            if (village === "") {

                alert(
                    "Please enter your village."
                );

                return;

            }


            /* =========================
               DISABLE SAVE BUTTON
            ========================= */

            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            saveButton.disabled =
                true;


            saveButton.textContent =
                "Saving...";


            showStatus(
                "Saving profile...",
                "loading-message"
            );


            try {

                /* =========================
                   SEND DATA TO BACKEND
                ========================= */

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/user/${userId}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name: name,

                                mobile: mobile,

                                email:
                                    email === ""
                                        ? null
                                        : email,

                                village: village

                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Profile update failed."
                    );

                }


                /* =========================
                   UPDATE LOCAL STORAGE
                   FOR FRONTEND CONSISTENCY
                ========================= */

                localStorage.setItem(
                    "registeredFullName",
                    name
                );

                localStorage.setItem(
                    "registeredMobile",
                    mobile
                );

                localStorage.setItem(
                    "registeredEmail",
                    email
                );

                localStorage.setItem(
                    "registeredVillage",
                    village
                );


                /* =========================
                   UPDATE DISPLAY
                ========================= */

                document.getElementById(
                    "profileName"
                ).textContent =
                    name;


                document.getElementById(
                    "nameDisplay"
                ).textContent =
                    name;


                document.getElementById(
                    "mobileDisplay"
                ).textContent =
                    mobile;


                document.getElementById(
                    "emailDisplay"
                ).textContent =
                    email || "Not provided";


                document.getElementById(
                    "villageDisplay"
                ).textContent =
                    village;


                /* =========================
                   EXIT EDIT MODE
                ========================= */

                exitEditMode();


                showStatus(
                    "Profile updated successfully!",
                    "success-message"
                );


                alert(
                    "Profile updated successfully!"
                );

            }

            catch (error) {

                console.error(
                    "Profile update error:",
                    error
                );


                showStatus(
                    error.message ||
                    "Unable to update profile.",
                    "error-message"
                );


                alert(
                    error.message ||
                    "Unable to update profile."
                );

            }

            finally {

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Save Changes";

            }

        }


        /* ==========================================
           CANCEL EDIT
        ========================================== */

        function cancelEdit() {

            loadProfile();

            exitEditMode();

            showStatus("");

        }


        /* ==========================================
           EXIT EDIT MODE
        ========================================== */

        function exitEditMode() {

            document
                .querySelectorAll(".detail-value")
                .forEach(function (element) {

                    element.style.display =
                        "inline";

                });


            document
                .querySelectorAll(".edit-input")
                .forEach(function (element) {

                    element.style.display =
                        "none";

                });


            document.getElementById(
                "editButton"
            ).style.display =
                "inline-block";


            document.getElementById(
                "logoutButton"
            ).style.display =
                "inline-block";


            document.getElementById(
                "saveButton"
            ).style.display =
                "none";


            document.getElementById(
                "cancelButton"
            ).style.display =
                "none";

        }


        /* ==========================================
           BACK TO DASHBOARD
        ========================================== */

        function goBack() {

            window.location.href =
                "dashboard.html";

        }


        /* ==========================================
           LOGOUT
        ========================================== */

        function logout() {

            const confirmLogout =
                confirm(
                    "Are you sure you want to logout?"
                );


            if (!confirmLogout) {
                return;
            }


            /*
               Remove logged-in user session.
            */

            localStorage.removeItem(
                "gramasathiUserId"
            );


            window.location.href =
                "login.html";

        }


        /* ==========================================
           LOAD PROFILE WHEN PAGE OPENS
        ========================================== */

        loadProfile();

    </script>

</body>

</html>
